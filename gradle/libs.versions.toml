[versions]
kotlinVersion = "2.1.21"
gsonVersion = "2.11.0"
okioVersion = "3.10.2"
okhttpVersion = "4.12.0"
pluginPublishVersion = "1.3.1"

[plugins]
jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlinVersion" }
pluginPublish = { id = "com.gradle.plugin-publish", version.ref = "pluginPublishVersion" }

[libraries]
gson = {module = "com.google.code.gson:gson", version.ref = "gsonVersion"}
okio = {module = "com.squareup.okio:okio", version.ref = "okioVersion"}
okhttp = {module = "com.squareup.okhttp3:okhttp", version.ref = "okhttpVersion"}
okhttpLoggingInterceptor = {module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttpVersion"}
okhttpMockwebserver = {module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttpVersion"}